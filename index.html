<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZH1 gyakorló – igaz/hamis</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f4;--card:#ffffff;--ink:#16222b;--mut:#587080;--line:#d3dde3;--acc:#0b5d73;--acc-ink:#fff;--ok:#17713f;--okbg:#e2f4ea;--no:#b3261e;--nobg:#fce8e6;--warn:#fff3cf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#17262e;--ink:#e6eef2;--mut:#9ab2bf;--line:#2b3f4a;--acc:#4fb8d1;--acc-ink:#07242c;--ok:#5fd18d;--okbg:#14352496;--no:#ff8d85;--nobg:#3d1b1996;--warn:#3b3416}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#17262e;--ink:#e6eef2;--mut:#9ab2bf;--line:#2b3f4a;--acc:#4fb8d1;--acc-ink:#07242c;--ok:#5fd18d;--okbg:#14352496;--no:#ff8d85;--nobg:#3d1b1996;--warn:#3b3416}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:clamp(12px,3vw,32px) max(clamp(12px,4vw,32px),env(safe-area-inset-left,0px)) calc(clamp(32px,6vw,64px) + 16px) max(clamp(12px,4vw,32px),env(safe-area-inset-right,0px))}
h1{font:700 clamp(1.35rem,4.5vw,2rem)/1.2 Georgia,"Times New Roman",serif;margin:8px 0 6px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,3.5vw,28px)}
.q{font:600 clamp(1.1rem,3.4vw,1.45rem)/1.45 Georgia,"Times New Roman",serif;margin:14px 0 18px}
table{border-collapse:collapse;width:100%;margin:12px 0 20px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600}
button{font:inherit;touch-action:manipulation;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 20px;min-height:48px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices button{font-weight:700;font-size:1.1rem;min-height:56px}
@media (hover:hover){.choices button:hover:not(:disabled){border-color:var(--acc)}}
.choices button:disabled{cursor:default}
.choices .picked{border-width:2px}
.choices .right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.choices .wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.fb{margin-top:18px;padding:14px 16px;border-radius:8px;border-left:5px solid var(--line)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--nobg);border-color:var(--no)}
.fb b{display:block;margin-bottom:4px}
.ref{color:var(--mut);font-size:.88rem;margin-top:8px}
.inf{background:var(--warn);border-radius:6px;padding:6px 10px;font-size:.88rem;margin-top:10px}
.actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end}
.grade{font:700 clamp(3rem,14vw,4.5rem)/1 Georgia,serif;margin:6px 0}
.grade.fail{color:var(--no)}.grade.pass{color:var(--ok)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600}
.hint{color:var(--mut);font-size:.85rem;margin-top:14px}

.tw{overflow-x:auto}
.actions{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:2}
.actions button{min-width:180px}
summary{padding:6px 0;min-height:44px}
@media (max-width:520px){
 .actions{justify-content:stretch;background:linear-gradient(to top,var(--card) 70%,transparent);padding-top:10px;margin-left:-2px;margin-right:-2px}
 .actions button{width:100%}
 .choices{gap:10px}
 .fb{padding:12px 12px}
 td,th{padding:8px 6px}
}
@media (min-width:521px) and (max-width:1024px){
 body{font-size:17px}
 main{max-width:720px}
}
@media (min-width:1025px){main{max-width:780px}}
@media (orientation:landscape) and (max-height:480px){
 .q{margin:8px 0 12px}
 .choices button{min-height:48px}
 .grade{font-size:3rem}
}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = [{"q": "Informatikai szempontból a “random” a “sequence” ellentéte.", "a": true, "e": "A „random” (tetszőleges) NEM véletlenszerűt jelent, hanem a „sequential” (szekvenciális, kötött sorrendű hozzáférés) ellentéte. Példa: Random Access Memory = Tetszőleges Hozzáférésű Memória.", "r": "Óravázlat (Paál Dávid), 2. fej. 3. pont (5. o.) és 8. fej. (36. o.)", "inf": false}, {"q": "A 4 bites többletes kód ábrázolásánál nincs negatív nulla", "a": true, "e": "Többletes kódban a nulla egyetlen alakja az 1000 (4 biten), így nincs +0/−0 páros. Negatív nulla csak az abszolútértékes (egyenes) és az egyes komplemens kódban van.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7. o.); Fixpontos bináris kódok (Excel); Kidolgozott kifejtős feladatrész – Mi a Többletes kód?", "inf": false}, {"q": "A TTL egyik előnye a feszültségfüggetlenség.", "a": false, "e": "A TTL fix feszültségszinteket különböztet meg (0–0,8 V = L, 2,0–5 V = H, tápfeszültsége 5 V), tehát nem feszültségfüggetlen. A CMOS szintjei a tápfeszültség arányában vannak megadva, és szélesebb tápfeszültség-tartományban (3–15 V) működik – ez a CMOS előnye.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.); Kidolgozott kifejtős feladatrész – CMOS előnyei a TTL-lel szemben", "inf": false}, {"q": "Kettes számrendszerben egy tört értéke nem minden esetben fejezhető ki pontosan", "a": true, "e": "A törtek átalakításánál a pontos átalakítás nem mindig lehetséges: csak az 1/2^k alakú (kettő-hatvány nevezőjű) törtek írhatók fel véges alakban kettes számrendszerben, a többi (pl. 1/10, 1/3) végtelen szakaszos tört.", "r": "Englander ch02 – Törtek (39–42. dia)", "inf": false}, {"q": "Kettes számrendszerben minden tört pontosan kifejezhető", "a": false, "e": "Kettes számrendszerben csak azok a törtek fejezhetők ki pontosan, amelyek nevezője kizárólag kettő hatványa (1/2, 1/4, 3/8…). Más nevezőnél (pl. 1/10) végtelen, periodikus alak jön ki.", "r": "Englander ch02 – Törtek (39–42. dia)", "inf": false}, {"q": "Az informatikában használt “digitális” szó görög eredetű.", "a": false, "e": "A „digitális” szó latin eredetű (digitus = ujj), nem görög.", "r": "Lovas A1 (6. dia); Englander ch02 (3. dia: digitus)", "inf": false}, {"q": "A két logikai kapuból álló RS tároló 1 bájt tárolására képes.", "a": false, "e": "Az RS tároló két, egymásba visszacsatolt logikai kapuból (NOR vagy NAND) áll, és 1 BIT tárolására képes (Set/Reset állapot). Egy bájt 8 bit, ahhoz 8 ilyen tároló kellene.", "r": "Óravázlat – sorrendi hálózatok / tárolók témaköre (pontos hely nem azonosítva; következtetés, ellenőrizd a jegyzetben)", "inf": true}, {"q": "A NOR technológia bájtonkénti elérésű.", "a": true, "e": "A NOR flash jellemzői: párhuzamos adathozzáférés, random címzés, bájtonkénti elérés, ezért közvetlen programfuttatásra alkalmas.", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "A 16-os számrendszerben 3 helyiértéken 4096 érték ábrázolható.", "a": true, "e": "A számrendszer a helyiértékeken az alap hatványaival dolgozik, így N helyiértéken alap^N különböző érték ábrázolható. Hexadecimálisan 3 helyiértéken 16^3 = 4096 érték (0–4095).", "r": "Englander ch02 (helyiértékes ábrázolás); ch04 (8 bit = 256 különböző szám); Óravázlat (Paál Dávid), 3. fej. 2. pont (7. o.)", "inf": false}, {"q": "A NAND technológia bájtonkénti elérésű.", "a": false, "e": "A NAND flash soros hozzáférésű és csak laponként (page) címezhető, nem bájtonként. A bájtonkénti elérés a NOR technológiára jellemző.", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "Matematikai logikában az A + 0 = 0", "a": false, "e": "A „+” a logikai VAGY (diszjunkció) jele. A 0 a VAGY semleges eleme, ezért A + 0 = A (nem 0). Az A + 1 = 1 lenne.", "r": "Értéktáblázatok (Excel) – logikai alapműveletek/azonosságok (témakör alapján, pontos munkalap nem azonosítva)", "inf": true}, {"q": "A 4 bites egyes komplemens ábrázolásnál van negatív nulla.", "a": true, "e": "Egyes komplemensben a negatív nulla az 1111 (a pozitív nulla 0000 minden bitjének negáltja).", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (8. o.); Fixpontos bináris kódok (Excel)", "inf": false}, {"q": "A számrendszerek hatványok és helyiértékek segítségével értelmezhetőek.", "a": true, "e": "A számrendszer azt jelenti, hogy a helyiértékeken a számrendszer alapjának hatványai szerepelnek (tízes, kettes, nyolcas, tizenhatos alap).", "r": "Óravázlat (Paál Dávid), 3. fej. 2. pont (7. o.); Englander ch02 (helyiértékes számábrázolás)", "inf": false}, {"q": "A 4 bites többletes kód ábrázolásánál a negatív előjelbit a 0.", "a": true, "e": "Többletes kódnál a negatív szám előjelbitje 0 (pl. −1 = 0111, +0 = 1000), a pozitívé 1. Negatív nulla nincs.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7. o.); Fixpontos bináris kódok (Excel); Kidolgozott kifejtős feladatrész – Mi a Többletes kód?", "inf": false}, {"q": "Az intel i7 CPU esetében a Memory Controller területarányosan sok magnyi részt foglal el.", "a": true, "e": "Az i7 processzor (Ivy Bridge-E) die-képén a Memory Controller külön, nagy blokk a magok (Core) és a megosztott L3 cache mellett; több magnyi területet foglal el.", "r": "Óravázlat (Paál Dávid), 14. fej. 2. pont – Intel i7 die-kép (70. o.)", "inf": false}, {"q": "A ferritgyűrűs tár olvasás művelete összetetteb az írásnál műveletnél.", "a": true, "e": "A ferritgyűrűs tár írása egyszerű (két metsző vezetéken fél-fél áramerősség). Az olvasás összetettebb: a statikus állapot nem olvasható, ezért 0-ra írási kísérletet végzünk és az S (Sense) vezetéken mérjük, indukálódik-e feszültség; olvasás után az eredeti értéket vissza kell írni.", "r": "Óravázlat (Paál Dávid), 5. fej. 5. pont (17. o.)", "inf": false}, {"q": "A shift balra azonos számrendszer alapjával történő szorzással.", "a": true, "e": "Bármely számrendszerben egy szám eltolása balra egy jeggyel az alappal való szorzással egyenlő. Pl. 1010₂ balra eltolva = 10100₂.", "r": "Englander ch02 – Shift (eltolás)", "inf": false}, {"q": "Egy CPU-ba épített GPU terület arányosan minimális részt foglal el", "a": false, "e": "A processzorba integrált GPU a lapkaterület jelentős (a magokkal összemérhető) részét foglalja el, nem minimálisat.", "r": "Nincs konkrét hely a jegyzetben; általános szakmai tudás / die-képek alapján (ellenőrizd az órai anyagban)", "inf": true}, {"q": "A CMOS egyik előnye a feszültség függetlenség.", "a": true, "e": "A TTL logikai szintjei fix feszültségtartományok (0–0,8 V, 2,0–5 V; táp: 5 V). A CMOS szintjei a tápfeszültség arányában vannak megadva (1/3, 2/3, 3/3), és szélesebb tápfeszültség-tartományban (3–15 V) működik – vagyis nem köti fix feszültség. (Közvetett: a „feszültségfüggetlenség” szót a jegyzet nem használja.)", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.); Kidolgozott kifejtős feladatrész – CMOS előnyei a TTL-lel szemben", "inf": false}, {"q": "A FET feszültségvezérelt eszköz", "a": true, "e": "A FET-nél a vezérlőelektróda (gate) szigetelt a csatornától; a csatornát a gate–source feszültség által keltett elektromos tér vezérli, a vezérlőáram gyakorlatilag nulla. Ezért feszültségvezérelt eszköz (a bipoláris tranzisztor ezzel szemben áramvezérelt).", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.) – tranzisztor-családok; a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A Super DLT nem mágneses rétegei vékonyabbak a DLT III rétegeinél", "a": true, "e": "Az eredeti kulcs szerint IGAZ. A DLT-család fejlődése során ugrásszerűen nőtt a sűrűség (DLT III: 1993, 10 GB → SuperDLT I: 2002, 160 GB), ehhez vékonyabb, finomabb rétegszerkezet kell. A konkrét rétegvastagságot a jegyzet nem közli – ez következtetés.", "r": "Óravázlat (Paál Dávid), 6. fej. (20. o.) – DLT/SuperDLT típusok, kapacitások", "inf": true}, {"q": "A Carry fogalom helyiértékre vonatkozik", "a": true, "e": "Az átviteli bit (Carry) azt jelzi, ha egy adott helyiértéken elvégzett művelet eredménye meghaladja az ott ábrázolható értéket – tehát helyiértékhez kötött fogalom.", "r": "Englander ch04 (30. dia); Óravázlat (Paál Dávid), 3. fej. 4. pont (8. o.); Kidolgozott kifejtős feladatrész – átvitel vs. túlcsordulás", "inf": false}, {"q": "Az Overflow mint fogalom számábrázolási tartományra vonatkozik", "a": true, "e": "A túlcsordulás (Overflow): összeadás/kivonás eredménye kívül esik az aktuális számábrázolási tartományon.", "r": "Englander ch04 (30. dia); Óravázlat (Paál Dávid), 3. fej. 4. pont (8. o.); Kidolgozott kifejtős feladatrész – átvitel vs. túlcsordulás", "inf": false}, {"q": "Matematikai logikában A X 1 = 1", "a": false, "e": "A „×” az ÉS (konjunkció) jele. Az 1 az ÉS semleges eleme, ezért A × 1 = A, nem 1 (csak A = 1 esetén lenne 1; A = 0 esetén az eredmény 0).", "r": "Értéktáblázatok (Excel) – logikai alapműveletek/azonosságok (témakör alapján, pontos munkalap nem azonosítva)", "inf": true}, {"q": "A pendrive és a memóriakártya jellemzően a csatlakozóban tér el", "a": true, "e": "A pendrive USB porton csatlakozik, a memóriakártya (CF, SD, MS stb.) külön kártyaformátum; a jegyzet szerint a lényegi különbség az eszközök vezérlő elektronikájában van. (A „csatlakozóban tér el” megfogalmazás szó szerint nincs a jegyzetben.)", "r": "Óravázlat (Paál Dávid), 8. fej. 5. pont (37–38. o.)", "inf": false}, {"q": "Az RP az oszlopfrissítési ciklusidőt jelenti", "a": false, "e": "Az RP a RAS Precharge, azaz a RAM sorelőtöltési ideje (hány buszciklus kell, hogy az aktuálisan nyitott sor lezáruljon és a következő megnyitható legyen). Az RC a sorfrissítési ciklusidő.", "r": "Óravázlat (Paál Dávid), 8. fej. 3. pont – DRAM (34. o.)", "inf": false}, {"q": "Az eredeti Turing gép 10–es számrendszert használt", "a": false, "e": "Az eredeti Turing-gép modell az egyes (unáris) számrendszert használta, nem a tízeset.", "r": "Óravázlat (Paál Dávid), 1. fej. 4. pont – Alan Turing (2. o.)", "inf": false}, {"q": "A Neumann elvnek nem része a Control-Flow", "a": false, "e": "A Neumann-elvek része a vezérlésáramlás (control flow): a tárolt program utasításait a vezérlőegység irányításával, sorban hajtja végre a gép.", "r": "Óravázlat (Paál Dávid), 1. fej. 5–8. pont – Neumann-elvek (4. o.); a „Control-Flow” szó szerinti említése nem ellenőrzött", "inf": true}, {"q": "A Neumann architektúra egy buszrendszert használ", "a": true, "e": "A Neumann-architektúra egy busz rendszert használ az adatokhoz és az utasításokhoz, összesen egy memória egységgel.", "r": "Óravázlat (Paál Dávid), 1. fej. 5. pont (4. o.); Kidolgozott kifejtős feladatrész – Neumann vs. Harvard", "inf": false}, {"q": "A Harvard architektúra egy memóriát használ", "a": false, "e": "A Harvard-architektúra külön memóriát (és külön buszt) használ az utasításoknak és az adatoknak, így egy időben tud utasítást és adatot beolvasni – két memória, két busz.", "r": "Óravázlat (Paál Dávid), 1. fej. 6. pont (4. o.); Kidolgozott kifejtős feladatrész – Neumann vs. Harvard", "inf": false}, {"q": "A módosított Harvard architektúra egy memóriát használ", "a": true, "e": "A módosított Harvard-architektúra külön buszon, egy időben olvas be adatot és utasítást, de azonos memóriából (egy memória, két busz).", "r": "Óravázlat (Paál Dávid), 1. fej. 7. pont (4. o.)", "inf": false}, {"q": "AZ AMD K-6 processzor 64 bites szervezésű", "a": false, "e": "Az AMD K6 (1997) az x86-os család 32 bites processzora. Az AMD 64 bites architektúrája (AMD64) csak 2003-tól jelent meg.", "r": "Nincs konkrét hely a jegyzetben; általános szakmai tudás (ellenőrizd az órai processzor-táblázatban)", "inf": true}, {"q": "A POST a FirmWare egyik szolgáltatása", "a": false, "e": "A POST (Power On Self Test) az alaplap BIOS-ához/UEFI-jéhez kapcsolódik (induláskori önteszt, „csipogó” BIOS-kódok), ezért a BIOS/UEFI szolgáltatása – nem általában a firmware-é.", "r": "Óravázlat (Paál Dávid), 2. fej. 4. pont (6. o.); Kidolgozott kifejtős feladatrész – FIRMWARE vs. BIOS", "inf": false}, {"q": "A ferritgyűrűs tár írás művelete összetettebb az olvasási műveletnél", "a": false, "e": "A ferritgyűrűs tárnál az írás az egyszerű (két metsző vezetéken fél-fél áram), az olvasás az összetettebb (0-ra írási kísérlet, S vezetéken feszültségmérés, majd visszaírás).", "r": "Óravázlat (Paál Dávid), 5. fej. 5. pont (17. o.)", "inf": false}, {"q": "A NOR technológia közvetlen programfuttatásra alkalmas", "a": true, "e": "A NOR technológia random címzésű, bájtonként elérhető, ezért közvetlen programfuttatásra alkalmas.", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "A NAND technológia csak laponként címezhető", "a": true, "e": "A NAND közvetlen programfuttatásra nem alkalmas, mert csak laponként címezhető.", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "A szabályzás nyílt hatásláncú folyamat", "a": false, "e": "A szabályozás zárt hatásláncú folyamat, visszacsatolással (az alapjel elérése és megtartása a cél, pl. termosztátos fűtés). A nyílt hatásláncú folyamat a vezérlés.", "r": "Óravázlat (Paál Dávid), 4. fej. 4. pont (13. o.)", "inf": false}, {"q": "Az északi híd a lassú perifériákkal tart kapcsolatot", "a": false, "e": "Az északi híd a nagy sebességű egységekkel (processzor, memória, grafikus vezérlő) tart kapcsolatot; a lassú perifériák a déli hídhoz csatlakoznak.", "r": "Nincs konkrét hely a jegyzetben; alaplap-felépítés (2. fej.) alapján, általános szakmai tudás", "inf": true}, {"q": "A ZBR a nagykapacitású HDD-k jellemzője", "a": false, "e": "A ZBR (Zone Bit Recording) a HDD-k általános jellemzője: a külső sávokra több szektort írnak, mint a belsőkre. Nem csak a nagykapacitású merevlemezekre jellemző.", "r": "Óravázlat (Paál Dávid), 7. fej. – HDD (pontos hely nem azonosítva; következtetés)", "inf": true}, {"q": "Az RP a sorelötöltési idő", "a": true, "e": "Az RP a RAS Precharge, azaz Sorelőtöltési idő. (Az RC a Sorfrissítési Ciklusidő.)", "r": "Óravázlat (Paál Dávid), 8. fej. 3. pont – DRAM (34. o.)", "inf": false}, {"q": "A NAND technológia párhuzamos hozzáférésű", "a": false, "e": "A NAND technológiát soros hozzáférés jellemzi (laponkénti címzés). A párhuzamos hozzáférés a NOR-ra jellemző.", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "A ferromágneses anyagok jellemző tulajdonsága a hiszterézis", "a": true, "e": "A hiszterézis (a rendszer pillanatnyi állapota függ a korábbi állapotától) mágneses formában a ferromágneses anyagoknál jelentkezik.", "r": "Óravázlat (Paál Dávid), 5. fej. 1. pont (14. o.)", "inf": false}, {"q": "A Neumann elv nem nyilatkozik a perifériákról", "a": false, "e": "A Neumann-elv nyilatkozik a perifériákról: az adatok és programok beolvasására, valamint az eredmények megjelenítésére önálló egységek (perifériák) szolgálnak.", "r": "Óravázlat (Paál Dávid), 1. fej. 8. pont (4. o.)", "inf": false}, {"q": "A Neumann architektúra két memóriát tartalmaz", "a": false, "e": "A Neumann-architektúra egy memóriát tartalmaz, egy buszon. A két memória a Harvard-architektúrára jellemző.", "r": "Óravázlat (Paál Dávid), 1. fej. 5. pont (4. o.); Kidolgozott kifejtős feladatrész – Neumann vs. Harvard", "inf": false}, {"q": "Az informatikában használt „analóg” szó görög eredetű", "a": true, "e": "Az „analóg” szó görög eredetű (ana + logos = arányos, megfelelő), míg a „digitális” latin (digitus). Az analóg szó eredetét a jegyzet nem közli, ez általános nyelvi tudás.", "r": "Lovas A1 (6. dia) / Englander ch02 (3. dia) a „digitális” eredetét adja; az „analóg” eredete a jegyzetben nem szerepel", "inf": true}, {"q": "A módosított Harvard architektúra egy buszrendszert használ", "a": false, "e": "A módosított Harvard-architektúra egy memóriát használ, de két buszon (külön az adatnak és az utasításnak).", "r": "Óravázlat (Paál Dávid), 1. fej. 7. pont (4. o.)", "inf": false}, {"q": "Az imperatív algoritmus random jellegű", "a": false, "e": "Az imperatív algoritmus szekvenciális jellegű (a programozó megmondja, mit és hogyan csináljon a program, lépésről lépésre). A „random” a szekvenciális ellentéte.", "r": "Óravázlat (Paál Dávid), 2. fej. 2–3. pont (5. o.)", "inf": false}, {"q": "Az Intel Core processzor család 32 bites szervezésű", "a": false, "e": "Az Intel Core processzorcsalád 64 bites szervezésű (x86-64 / Intel 64).", "r": "Óravázlat (Paál Dávid), 14. fej. – processzorcsaládok (pontos hely nem azonosítva; általános szakmai tudás)", "inf": true}, {"q": "Az alaplap jellemzően rendelkezik BIOS-al vagy UEFI-vel", "a": true, "e": "Az alaplap a rendszer-inicializálási információt BIOS esetén egy dedikált chipen tárolja; az UEFI egy .efi fájlban. A korszerű alaplapok BIOS-át/UEFI-jét tároló chipek Flash memóriák.", "r": "Óravázlat (Paál Dávid), 2. fej. 4. pont (6. o.); 8. fej. 5. pont (38. o.)", "inf": false}, {"q": "Kettes számrendszerben nem minden tört fejezhető ki pontosan", "a": true, "e": "A törtek átalakításánál a pontos átalakítás nem mindig lehetséges: csak az 1/2^k alakú törtek ábrázolhatók pontosan (kettes alapban véges alakkal).", "r": "Englander ch02 – Törtek (39–42. dia)", "inf": false}, {"q": "A shift jobbra azonos a számrendszer alapjával történő szorzással", "a": false, "e": "A shift jobbra az alappal való OSZTÁSSAL azonos; a szorzással a shift balra azonos.", "r": "Englander ch02 – Shift (eltolás)", "inf": false}, {"q": "A NAND technológia közvetlen programfuttatásra alkalmas.", "a": false, "e": "A NAND csak laponként címezhető, ezért közvetlen programfuttatásra nem alkalmas; erre a NOR technológia alkalmas.", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "Az Excess 127 esetében a mantissza kvázi “törtként szerepel”.", "a": true, "e": "Excess 127 esetében a mantissza kvázi „törtként” szerepel (1.M alak, az 1-es nincs eltárolva), így egy helyiértéknyi plusz pontosság nyerhető. Visszaállításkor erre külön ügyelni kell.", "r": "Óravázlat (Paál Dávid), 3. fej. 8. pont (9. o.); Englander ch05 (20. dia); Kidolgozott kifejtős feladatrész – Excess127", "inf": false}, {"q": "A 4 bites abszolútértékes ábrázolásnál nincs negatív nulla.", "a": false, "e": "Abszolútértékes (egyenes) kódban a +0 = 0000, a −0 = 1000, tehát VAN negatív nulla.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7–8. o.); Fixpontos bináris kódok (Excel)", "inf": false}, {"q": "Matematikai logikában az A+(B×C)=(A+B)×(A+C) állítás.", "a": true, "e": "Ez a disztributivitás törvénye: A + (B × C) = (A + B) × (A + C).", "r": "Értéktáblázatok (Excel) – 003. munkalap, Disztributivitás", "inf": false}, {"q": "A ferromágneses anyagok jellemzője a hiszterézis", "a": true, "e": "A hiszterézis (a rendszer pillanatnyi állapota függ a korábbi állapotától) mágneses formában a ferromágneses anyagoknál jelentkezik.", "r": "Óravázlat (Paál Dávid), 5. fej. 1. pont (14. o.)", "inf": false}, {"q": "A hétszegmens kijelzős óra értelmezhető analóg óraként", "a": false, "e": "A hétszegmenses kijelzős óra számjegyeket, véges számú diszkrét értéket jelenít meg, tehát digitális óra, nem analóg. (Az analóg folyamatosan változik.)", "r": "Óravázlat (Paál Dávid), 1. fej. 1. pont (1. o.); Kidolgozott kifejtős feladatrész – analóg / digitális", "inf": true}, {"q": "A homokóra csak analóg óraként értelmezhető.", "a": false, "e": "A homokóra digitálisan is értelmezhető: a homokszemek száma véges, így két pont között véges számú lépés van (a jegyzet digitális definíciója). Besorolása a definícióból következtetett.", "r": "Óravázlat (Paál Dávid), 1. fej. 1. pont (1. o.); Kidolgozott kifejtős feladatrész – analóg / digitális", "inf": true}, {"q": "Az informatikában használt “analóg” szó latin eredetű.", "a": false, "e": "Az „analóg” szó görög eredetű, nem latin.", "r": "Az „analóg” eredete a jegyzetben nem szerepel; általános nyelvi tudás (a „digitális” latin: Lovas A1, 6. dia)", "inf": true}, {"q": "A hiszterézis görög eredetű szó.", "a": true, "e": "A hiszterézis szó a görög nyelvből ered, jelentése hiányosság, késés.", "r": "Óravázlat (Paál Dávid), 5. fej. 1. pont (14. o.)", "inf": false}, {"q": "A FET vezérléséhez gyakorlatilag nincs szükség áramra.", "a": true, "e": "A FET gate-elektródája szigetelt, ezért a vezérléséhez gyakorlatilag nem folyik áram; a vezérlést a gate–source feszültség végzi.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.) – tranzisztor-családok; a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A FET vezérléséhez gyakorlatilag nincs szükség feszültségre.", "a": false, "e": "A FET feszültségvezérelt eszköz: a vezérléséhez éppen feszültségre van szükség (gate–source feszültség).", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.); a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A FET vezérléséhez gyakorlatilag csak feszültségre van szükség.", "a": true, "e": "A FET feszültségvezérelt: a gate szigetelt, így a vezérléshez gyakorlatilag csak feszültség kell, áram nem.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.); a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A MOSFET gyakorlatilag csak egy szigetelőrétegben tér el a FET-től.", "a": true, "e": "A jegyzet a MOSFET-et szigetelt vezérlőelektródás FET-ként (IGFET) írja, ábráján a vezérlőelektróda alatt Oxide (szigetelő) réteg látható. (Közvetett: szöveges kimondás nincs, az ábrafeliratból következik.)", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont – ábrák és ábrafelirat (1. o.)", "inf": false}, {"q": "A tranzisztor és a FET is informatikai szempontból kapcsolóelem.", "a": true, "e": "A tranzisztor a második generációs gépek jellemző kapcsolóeleme. A FET-ek közül a MOSFET-ek az SRAM/DRAM celláknál ténylegesen kapcsolóként működnek (pl. a DRAM sorának MOSFET-jeit bekapcsolják).", "r": "Lovas A1 (18. dia: jellemző kapcsolóelem a tranzisztor); Óravázlat (Paál Dávid), 8. fej. 2–3. pont (33–34. o.)", "inf": false}, {"q": "A tranzisztor áramvezérelt eszkösz.", "a": true, "e": "A bipoláris tranzisztor áramvezérelt eszköz: a kis bázisáram vezérli a nagyobb kollektoráramot.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.) – tranzisztor-családok; a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A tranzisztor feszültségvezérelt eszköz.", "a": false, "e": "A (bipoláris) tranzisztor áramvezérelt, nem feszültségvezérelt. A feszültségvezérelt a FET.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.); a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A TTL energiatakarékosabb, mint a CMOS.", "a": false, "e": "A CMOS az energiatakarékosabb: a TTL (bipoláris) állandóan áramot vesz fel, a CMOS főleg kapcsoláskor. A CMOS előnyei: alacsonyabb energiafogyasztás, kevesebb hőtermelés.", "r": "Kidolgozott kifejtős feladatrész – CMOS előnyei a TTL-lel szemben; Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.)", "inf": false}, {"q": "A TTL akár a 2/3 alatti szintet is 1-esnek érzékeli.", "a": true, "e": "A TTL-nél a logikai 1 bemeneti tartománya 2,0–5 V. 5 V-os tápnál a 2/3 kb. 3,3 V, tehát a 2,0 V (ami ennél alacsonyabb) is még 1-esnek számít.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.)", "inf": false}, {"q": "A TTL a pontosan 2/3 szintet sem tudja értelmezni.", "a": false, "e": "A TTL-nél 0–0,8 V = L, 2,0–5 V = H; értelmezhetetlen csak a 0,8–2,0 V közötti sáv. A 2/3 szint (5 V-nál kb. 3,3 V) a H tartományba esik, tehát a TTL értelmezni tudja (1-esként). Az eredeti listában IGAZ szerepelt, de a „Kijavítva” oszlop (0) és a szintek is HAMIS-t adnak.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.)", "inf": false}, {"q": "A TTL-re jobban jellemző a termikus veszteség, mint a CMOS-ra.", "a": true, "e": "A TTL (bipoláris) több energiát vesz fel, ezért több hő termelődik; a CMOS előnye az alacsonyabb energiafogyasztás és a kevesebb hőtermelés. Így a termikus veszteség a TTL-re jellemzőbb.", "r": "Kidolgozott kifejtős feladatrész – CMOS előnyei a TTL-lel szemben; Óravázlat (Paál Dávid), 1. fej. 3. pont (hőveszteség → hűtés)", "inf": false}, {"q": "A CMOS fix feszültségszintekkel dolgozik.", "a": false, "e": "A CMOS szintjei a tápfeszültség arányában vannak megadva (1/3, 2/3, 3/3), nem fix feszültségértékek. A fix feszültségtartományok a TTL-re jellemzők.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.)", "inf": false}, {"q": "Az eredeti Turing gép 1-es számrendszert használt.", "a": true, "e": "A Turing-gép modell szinten eredetileg az egyes számrendszert használta.", "r": "Óravázlat (Paál Dávid), 1. fej. 4. pont – Alan Turing (2. o.)", "inf": false}, {"q": "A Harvard architektúra egy buszrendszert használ.", "a": false, "e": "A Harvard-architektúra külön buszon, egy időben olvas be adatot és utasítást két külön memóriából (két memória, két busz), nem egy buszrendszert használ.", "r": "Óravázlat (Paál Dávid), 1. fej. 6. pont (4. o.); Kidolgozott kifejtős feladatrész – Neumann vs. Harvard", "inf": false}, {"q": "Az 5794861(10) értéke 10110000110110000101100(2) .", "a": false, "e": "Az 5794861₁₀ helyes kettes alakja 10110000110110000101101₂. A megadott szám végén 100 áll 101 helyett; a szám páratlan, ezért a kettes alakja 1-re végződik. (Számolással ellenőrizve.)", "r": "Englander ch02 (átváltás 10-es és 2-es alap között)", "inf": false}, {"q": "Az 10010011(2) értéke 93(10)", "a": false, "e": "10010011₂ = 128 + 16 + 2 + 1 = 147₁₀, nem 93. (A 93₁₀ = 01011101₂.)", "r": "Englander ch02 (átváltás); Kidolgozott kifejtős feladatrész – 10010110 átváltása (ugyanaz a módszer)", "inf": false}, {"q": "Az “AND” igazságtáblája több 1-est tartalmaz, mint az “XOR”.", "a": false, "e": "Az AND igazságtáblájában egyetlen 1-es van (A=1, B=1), az XOR-ban kettő (01 és 10 bemenetnél). Tehát az AND-ben KEVESEBB az 1-es.", "r": "Kidolgozott kifejtős feladatrész – XOR (értéktábla); Értéktáblázatok (Excel)", "inf": false}, {"q": "A Statikus Hazárd csak rövid, egyszeri jelváltást okoz a kimeneten.", "a": true, "e": "A statikus hazárd a kimeneten rövid, egyszeri impulzust (tüskét) okoz. Oka: egy logikai kapu két bemenetére a jelek kis késéssel érkeznek.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.); Kidolgozott kifejtős feladatrész – statikus hazárd", "inf": false}, {"q": "A Statikus Hazárdot a szekunder változók okozzák.", "a": false, "e": "A statikus hazárd oka a „kapunyi” késés (egy kapu két bemenetére a jelek kis eltéréssel érkeznek). A szekunder változók a rendszerhazárdhoz kapcsolódnak, nem a statikus hazárdhoz.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.); Kidolgozott kifejtős feladatrész – statikus hazárd", "inf": false}, {"q": "A Lényeges Hazárd csak aszinkron sorrendi hálózatokban fordul elő", "a": true, "e": "A lényeges hazárd csak aszinkron sorrendi hálózatokban jelentkezik (a szekunder változó és a bemeneti változó sebessége összemérhető, versenyhelyzet alakul ki).", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A kettes számrendszereben 8 helyiértéken 256 érték ábrázolható.", "a": true, "e": "8 helyiértéken (bit) 2^8 = 256 különböző szám ábrázolható (előjel nélkül 0–255).", "r": "Englander ch04 (23. dia: 8 bites szám, 256 különböző szám); Óravázlat (Paál Dávid), 3. fej. 2. pont (7. o.)", "inf": false}, {"q": "A 4 bites kettes komplemens ábrázolásnál a negatív előjelbit a 0", "a": false, "e": "Kettes komplemensben a negatív szám előjelbitje 1. Az előjelbit 0 negatív számnál csak a többletes kódban van.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7–8. o.); Fixpontos bináris kódok (Excel)", "inf": false}, {"q": "A 4 bites többletes kód ábrázolás 2^n többletet használ.", "a": false, "e": "Többletes kódban minden számot 2^(n−1) többlettel ábrázolunk (n=4 biten 2³ = 8 = 1000₂), nem 2^n-nel.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7. o.); Kidolgozott kifejtős feladatrész – Mi a Többletes kód?", "inf": false}, {"q": "Az Excess 50 esetében a legnagyobb ábrázolt kitevő a 99.", "a": false, "e": "Excess 50-nél a tárolt 0–99 tartomány −50-től +49-ig adja az ábrázolt kitevőket (a 0 érték kihasít egyet a pozitív oldalból), ezért a legnagyobb kitevő +49, nem 99.", "r": "Óravázlat (Paál Dávid), 3. fej. 6. pont (8–9. o.); Englander ch05 (6. dia)", "inf": false}, {"q": "Az Excess 50 esetében az ábrázolt szám 49 nagyságrendet fed le.", "a": false, "e": "Excess 50-nél a 0–99 tárolt értékek 100 különböző kitevőt (−50…+49) jelentenek, tehát 100 nagyságrendet fed le, nem 49-et.", "r": "Óravázlat (Paál Dávid), 3. fej. 6. pont (8–9. o.); Englander ch05 (6. dia)", "inf": false}, {"q": "A kazettás/MCD lemezt Jánosi Marcell készítette a 70-es évek végén.", "a": true, "e": "Az eredeti kulcs szerint IGAZ. A jegyzet szerint Jánosi Marcell (BRG, 1974) alkotta meg az első merevtokos 3,0 hüvelykes hajlékonylemezt. A „kazettás/MCD” és a „70-es évek vége” megfogalmazás szó szerint nincs a jegyzetben (1974 a 70-es évek közepe) – ellenőrizd.", "r": "Óravázlat (Paál Dávid), 7. fej. 1. pont – FDD (22. o.)", "inf": true}, {"q": "A floppy-t Jánosi Marcell alkotta meg a 70-es években", "a": true, "e": "Jánosi Marcell 1974-ben alkotta meg az első merevtokos 3,0 hüvelykes hajlékonylemezt; az első (8 hüvelykes, puhatokos) floppyt az IBM fejlesztette ki a 60-as évek második felében. (Részben igaz.)", "r": "Óravázlat (Paál Dávid), 7. fej. 1. pont – FDD (22. o.)", "inf": false}, {"q": "A vezérlés nyitott hatásláncú folyamat, visszacsatolás nélkül.", "a": true, "e": "A vezérlés nyitott hatásláncú folyamat, visszacsatolás nélkül: a beavatkozás után nem értesülünk a hatásról (cél egy előre meghatározott műveletsor végrehajtása).", "r": "Óravázlat (Paál Dávid), 4. fej. 4. pont (13. o.)", "inf": false}, {"q": "Egy nagyobb alapú számrendszer kevesebb számjegy használatát igényli. (ugyanazon szám felírásához)", "a": true, "e": "Egy adott szám felírásához nagyobb alap esetén több szimbólum kell, de kevesebb számjegy (pl. 65₁₆ = 101₁₀ = 145₈ = 1100101₂).", "r": "Englander ch02 (14–15. dia)", "inf": false}, {"q": "Az intel i3,i5, i7 processzor családok 32 bites szervezésűek.", "a": false, "e": "Az Intel i3, i5, i7 processzorok 64 bites szervezésűek (x86-64).", "r": "Óravázlat (Paál Dávid), 14. fej. – processzorcsaládok (pontos hely nem azonosítva; általános szakmai tudás)", "inf": true}, {"q": "A Mark-I és az ENIAC gépek 2-es számrendszert használtak.", "a": false, "e": "A korai gépek (Mark I, ENIAC) decimális, tízes számábrázolást használtak, nem kettest.", "r": "Englander ch02 (2. dia); Óravázlat (Paál Dávid), 1. fej. 4. pont (3. o.)", "inf": false}, {"q": "A Mark-I és az ENIAC gépek 10-es számrendszert használtak.", "a": true, "e": "A korai számítógépek decimális (tízes) számábrázolást használtak: Mark I és ENIAC.", "r": "Englander ch02 (2. dia); Óravázlat (Paál Dávid), 1. fej. 4. pont (3. o.)", "inf": false}, {"q": "Az általánosan használt programozási nyelvek deklaratívak.", "a": false, "e": "Az általánosan használt programozási nyelvek imperatívak (a programozó megmondja, mit és hogyan csináljon a program). A deklaratív nyelvekben a programozó állításokat közöl.", "r": "Óravázlat (Paál Dávid), 2. fej. 2. pont (5. o.)", "inf": false}, {"q": "A shift jobbra azonos a számrendszer alapjával történő osztással.", "a": true, "e": "Egy szám eltolása jobbra egy jeggyel az alappal való osztással egyenlő. Pl. 1010₂ jobbra eltolva = 101₂.", "r": "Englander ch02 – Shift (eltolás)", "inf": false}, {"q": "A shift balra azonos a számrendszer alapjával történő szorzással.", "a": true, "e": "Bármely számrendszerben egy szám eltolása balra egy jeggyel az alappal való szorzással egyenlő. Pl. 1010₂ balra eltolva = 10100₂.", "r": "Englander ch02 – Shift (eltolás)", "inf": false}, {"q": "A kettes számrendszerben 8 helyi értéken 255 számjegy ábrázolható.", "a": false, "e": "8 helyiértéken 256 különböző érték ábrázolható (0–255). A 255 a legnagyobb ábrázolható szám (2^8 − 1), nem az ábrázolható értékek száma, és nem „számjegyek” száma (a számjegyek száma 8).", "r": "Englander ch04 (4. dia); Óravázlat (Paál Dávid), 3. fej. 2. pont (7. o.)", "inf": false}, {"q": "A 4 bites egyes komplemens ábrázolásánál a negatív előjelbit az 1", "a": true, "e": "Egyes komplemensben a negatív számok vezető bitje 1 (a pozitív szám bitjeinek negálásával kapjuk), pl. +1 = 0001, −1 = 1110.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (8. o.); Fixpontos bináris kódok (Excel)", "inf": false}, {"q": "A 4 bites többletes kód ábrázolás 2 az “n” plusz egyediken, plusz 1 többletet használ", "a": false, "e": "A többletes kód többlete 2^(n−1) (n=4 esetén 2³ = 8), nem „2^n + 1”.", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7. o.); Kidolgozott kifejtős feladatrész – Mi a Többletes kód?", "inf": false}, {"q": "Az előidejűség lényege kizárólag az, hogy egyik folyamat megelőzi a másikat.", "a": false, "e": "Az eredeti kulcs szerint HAMIS. Az „előidejűség” fogalmát a rendelkezésre álló jegyzetben nem találtam meg szó szerint; a „kizárólag” kitétel miatt az állítás túl szűk – az ilyen kizárólagos megfogalmazások tipikusan hamisak. Ellenőrizd az előadásanyagban.", "r": "Nem található a rendelkezésre álló anyagokban (következtetés a kitétel alapján)", "inf": true}, {"q": "A 4 bites többletes kód ábrázolás 2^n-1 többletet használ", "a": true, "e": "Többletes kódban minden számot 2^(n−1) többlettel ábrázolunk; n=4 biten ez 2³ = 8 = 1000₂. (A kérdés „2^n-1” jelölése ezt jelenti.)", "r": "Óravázlat (Paál Dávid), 3. fej. 3. pont (7. o.); Kidolgozott kifejtős feladatrész – Mi a Többletes kód?", "inf": false}, {"q": "Az Excess 50 esetében a legnagyobb ábrázolt kitevő a 49.", "a": true, "e": "Excess 50-nél a 0–99 tárolt érték az ábrázolt kitevőket −50-től +49-ig adja; a 0 érték kihasít egyet a pozitív oldalból, ezért a maximum +49 (minimum −50).", "r": "Óravázlat (Paál Dávid), 3. fej. 6. pont (8–9. o.); Englander ch05 (6. dia)", "inf": false}, {"q": "Az Excess 128 esetében a mantissza „klasszikus” alakú.", "a": true, "e": "Excess 128 esetében a mantissza „klasszikus” alakú: a bázispont az első nem nulla karakter elé kerül (0.M).", "r": "Óravázlat (Paál Dávid), 3. fej. 8. pont (9. o.); Englander ch05 (20. dia); Kidolgozott kifejtős feladatrész – Excess-128", "inf": false}, {"q": "A NOR technológiát párhuzamos adathozzáférés jellemzi.", "a": true, "e": "A NOR technológiát párhuzamos adathozzáférés jellemzi (a NAND-ot soros).", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "A NAND technológiát soros hozzáférés jellemzi.", "a": true, "e": "A NAND technológiát soros adathozzáférés jellemzi (laponkénti címzés, nagyobb adatmennyiségek írására/olvasására alkalmas).", "r": "Óravázlat (Paál Dávid), 8. fej. 6. pont (38. o.)", "inf": false}, {"q": "A funkcionális hazárd akkor következik be amikor több bemeneti változó egyszerre változik meg", "a": true, "e": "Funkcionális hazárd akkor jelentkezhet, ha több bemeneti változó változik egyszerre (aszinkron sorrendi hálózatokban).", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A funkcionális hazard kivédésének biztos módja a szinkronizáció.", "a": true, "e": "A funkcionális hazárd kivédésének legbiztosabb módja a szinkronizáció.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A statikus hazárd akkor következik be amikor a kombinációs hálózat egyik bemenete megváltozik.", "a": true, "e": "A statikus hazárd a kombinációs hálózat egyik bemenetének megváltozásakor jön létre.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.); Kidolgozott kifejtős feladatrész – statikus hazárd", "inf": false}, {"q": "A dinamikus hazárd akkor következik be amikor 2-nél többszintű hálózatban, 1 jel legalább 3 úton terjed a kimenetre", "a": true, "e": "Dinamikus hazárd csak 2-nél többszintű hálózatban jöhet létre; feltétele, hogy egy jel legalább 3 úton terjedjen a kimenetre.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.); Kidolgozott kifejtős feladatrész – dinamikus hazárd", "inf": false}, {"q": "A dinamikus hazárd kivédéséhez meg kell szűntetni a statikus hazárdot", "a": true, "e": "A dinamikus hazárd kivédhető a statikus hazárdok megszüntetésével.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.); Kidolgozott kifejtős feladatrész – dinamikus hazárd", "inf": false}, {"q": "A lényeges hazárd az aszinkron sorrendi hálózatokban jelentkezik.", "a": true, "e": "A lényeges hazárd csak aszinkron sorrendi hálózatokban jelentkezik (a szekunder és a bemeneti változó sebessége összemérhető, versenyhelyzet alakul ki).", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A lényeges hazárd kiküszöböléséhez szándékos késleltetést kell alkalmazni vagy módosítani az állapottáblát.", "a": true, "e": "A lényeges hazárd kiküszöböléséhez szándékos késleltetést kell alkalmazni, vagy módosítani kell az állapottáblát (ami jellemzően állapotszám-növekedéssel jár).", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A statikus hazárd megszűntetéséhez célszerű áttervezni/ átalakítani a hálózatot.", "a": true, "e": "A statikus hazárdot tervezési hiba okozza, ezért célszerű áttervezni vagy átalakítani a hálózatot.", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A rendszer hazárd több szekunder változó esetén fordulhat elő.", "a": true, "e": "A rendszerhazárd több szekunder változó esetén fordulhat elő (a visszacsatoló ágban lévő flip-flopok bemenetén eltérő időkésleltetések vannak).", "r": "Óravázlat (Paál Dávid), 4. fej. 3. pont (12. o.)", "inf": false}, {"q": "A napóra csak analóg óraként értelmezhető", "a": true, "e": "A jegyzet analóg/digitális definíciója szerint (két pont között végtelen vagy véges számú lépés) a napóra árnyéka folyamatosan mozog, tehát analóg; digitális értelmezés nem következik belőle. FIGYELEM: az eredeti listában ellentmondás volt (119. sor: HAMIS, 125. sor: IGAZ, „napóra digitális óraként” kérdés: HAMIS) – ezt a legtöbb sor és a definíció alapján oldottam fel, ellenőrizd.", "r": "Óravázlat (Paál Dávid), 1. fej. 1. pont (1. o.); Kidolgozott kifejtős feladatrész – analóg / digitális", "inf": true}, {"q": "A szabályzás egy nyílt hatásláncú folyamat.", "a": false, "e": "A szabályozás zárt hatásláncú folyamat, visszacsatolással. A nyílt hatásláncú folyamat a vezérlés.", "r": "Óravázlat (Paál Dávid), 4. fej. 4. pont (13. o.)", "inf": false}, {"q": "A TTL akár a 2/3 alatti szintet is 1-es szintnek érzékeli. igaz", "a": true, "e": "A TTL-nél a logikai 1 bemeneti tartománya 2,0–5 V. 5 V-os tápnál a 2/3 kb. 3,3 V, tehát a 2,0 V (ami ennél alacsonyabb) is még 1-esnek számít.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.)", "inf": false}, {"q": "Egy HDD jellemzően rendelkezik BIOS-sal.", "a": false, "e": "A BIOS rugalmasan bővíthető hardverre (alaplapra) készült működtető szoftver; a HDD a jegyzet szerint firmware-rel rendelkezik (a firmware példái közt szerepel a HDD).", "r": "Óravázlat (Paál Dávid), 2. fej. 4. pont (6. o.); Kidolgozott kifejtős feladatrész – FIRMWARE vs. BIOS", "inf": false}, {"q": "A homokóra értelmezhető digitális óraként.", "a": true, "e": "A homokóránál a lépések (homokszemek) száma véges, két pont között véges számú lépés van – ez a jegyzet digitális definíciója. A besorolás a definícióból következtetett.", "r": "Óravázlat (Paál Dávid), 1. fej. 1. pont (1. o.); Kidolgozott kifejtős feladatrész – analóg / digitális", "inf": true}, {"q": "Informatika szempontból a \"random\" a \"sequence\" ellentéte.", "a": true, "e": "A „random” (tetszőleges) NEM véletlenszerűt jelent, hanem a „sequential” (szekvenciális) hozzáférés ellentéte. Példa: Random Access Memory = Tetszőleges Hozzáférésű Memória.", "r": "Óravázlat (Paál Dávid), 2. fej. 3. pont (5. o.) és 8. fej. (36. o.)", "inf": false}, {"q": "A CARRY túlcsordulást jelent.", "a": false, "e": "A Carry és az Overflow két különböző fogalom: a Carry a helyiértékre vonatkozik (átvitel), az Overflow a számábrázolási tartományra (túlcsordulás).", "r": "Englander ch04 (30. dia); Óravázlat (Paál Dávid), 3. fej. 4. pont (8. o.); Kidolgozott kifejtős feladatrész – átvitel vs. túlcsordulás", "inf": false}, {"q": "A RAM jelentése \"Tetszőleges Hozzáférésű Memória\".", "a": true, "e": "Random Access Memory = Tetszőleges Hozzáférésű Memória; a „random” NEM véletlenszerűt jelent, hanem a szekvenciális hozzáférés ellentétét.", "r": "Óravázlat (Paál Dávid), 8. fej. (36. o.); 2. fej. 3. pont (5. o.)", "inf": false}, {"q": "A bipoláris tranzisztor vezérléséhez gyakorlatilag nincs szükség áramra.", "a": false, "e": "A bipoláris tranzisztor áramvezérelt: a vezérléséhez bázisáram kell, tehát nem igaz, hogy gyakorlatilag nincs szükség áramra.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.); a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "A napóra értelmezhető digitális óraként.", "a": false, "e": "A napóra árnyéka folyamatosan mozog (két pont között végtelen sok lépés), ezért analóg jellegű; digitális értelmezés a jegyzet definíciójából nem következik.", "r": "Óravázlat (Paál Dávid), 1. fej. 1. pont (1. o.); Kidolgozott kifejtős feladatrész – analóg / digitális", "inf": true}, {"q": "A vezérlés egy nyílt hatásláncú folyamat.", "a": true, "e": "A vezérlés nyitott hatásláncú folyamat, visszacsatolás nélkül (a beavatkozás után nem értesülünk a hatásról).", "r": "Óravázlat (Paál Dávid), 4. fej. 4. pont (13. o.)", "inf": false}, {"q": "Egy HDD jellemzően rendelkezik FirmWare-el.", "a": true, "e": "A firmware egy adott, jellemzően nem rugalmasan bővíthető hardverre készült működtető szoftver; példái között szerepel a HDD.", "r": "Óravázlat (Paál Dávid), 2. fej. 4. pont (6. o.); Kidolgozott kifejtős feladatrész – FIRMWARE definíciója", "inf": false}, {"q": "Az OVERFLOW bármelyik helyiértéken bekövetkezhet.", "a": false, "e": "Az Overflow nem helyiértékhez kötött, hanem a számábrázolási tartomány túllépését jelenti. A helyiértékhez kötött fogalom a Carry.", "r": "Englander ch04 (30. dia); Óravázlat (Paál Dávid), 3. fej. 4. pont (8. o.); Kidolgozott kifejtős feladatrész – átvitel vs. túlcsordulás", "inf": false}, {"q": "Egy alaplap jellemzően rendelkezik BIOS-sal vagy UEFI-vel.", "a": true, "e": "Az alaplap a rendszer-inicializálási információt BIOS esetén egy dedikált chipen tárolja; az UEFI egy .efi fájlban.", "r": "Óravázlat (Paál Dávid), 2. fej. 4. pont (6. o.); 8. fej. 5. pont (38. o.)", "inf": false}, {"q": "A CMOS energiatakarékosabb mint a TTL.", "a": true, "e": "A CMOS energiatakarékosabb, mint a TTL: a CMOS főleg kapcsoláskor vesz fel áramot, a TTL (bipoláris) folyamatosan. A CMOS előnye az alacsonyabb energiafogyasztás és a kevesebb hőtermelés.", "r": "Kidolgozott kifejtős feladatrész – CMOS előnyei a TTL-lel szemben", "inf": false}, {"q": "A bipoláris tranzisztor áramvezérelt eszköz.", "a": true, "e": "A bipoláris tranzisztor áramvezérelt eszköz: a kis bázisáram vezérli a nagyobb kollektoráramot.", "r": "Óravázlat (Paál Dávid), 1. fej. 3. pont (1. o.) – tranzisztor-családok; a vezérlési elv általános elektronikai tudásból következtetett", "inf": true}, {"q": "Az EDVAC számítógép 10-es számrendszert használt.", "a": false, "e": "Az EDVAC a Neumann-elvek mentén épült, és már kettes számrendszert használt (bináris kódolás), nem tízest.", "r": "Óravázlat (Paál Dávid), 1. fej. 4. pont – EDVAC (3. o.); Lovas A1 (16. dia)", "inf": false}];
const N = 24;
const app = document.getElementById('app');
let qs = [], idx = 0, score = 0, answers = [], answered = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function grade(p) { return p >= 23 ? 5 : p >= 21 ? 4 : p >= 19 ? 3 : p >= 17 ? 2 : 1; }
const gradeName = g => ({5:'jeles',4:'jó',3:'közepes',2:'elégséges',1:'elégtelen (bukás)'})[g];
const inf = o => o.inf ? '<div class="inf">Ez a magyarázat a jegyzetből következtetett, nincs szó szerint benne – érdemes ellenőrizni.</div>' : '';

function home() {
  app.innerHTML = `
    <h1>ZH1 gyakorló – igaz vagy hamis</h1>
    <p class="sub">${N} véletlenszerű állítás a ${DATA.length} kérdésből. Minden válasz után megjelenik a magyarázat és a hivatkozás.</p>
    <div class="card">
      <div class="tw"><table>
        <tr><th>Pontszám</th><th>Jegy</th></tr>
        <tr><td>23–24</td><td>5 (jeles)</td></tr>
        <tr><td>21–22</td><td>4 (jó)</td></tr>
        <tr><td>19–20</td><td>3 (közepes)</td></tr>
        <tr><td>17–18</td><td>2 (elégséges)</td></tr>
        <tr><td>0–16</td><td>elégtelen (bukás)</td></tr>
      </table></div>
      <button class="primary" id="start">Teszt indítása</button>
      <p class="hint">Billentyűk: I = igaz, H = hamis, Enter = következő.</p>
    </div>`;
  document.getElementById('start').onclick = start;
}

function start() { qs = shuffle(DATA).slice(0, N); idx = 0; score = 0; answers = []; show(); }

function show() {
  const o = qs[idx]; answered = false;
  app.innerHTML = `
    <div class="meta"><span>${idx + 1}. kérdés / ${N}</span><span>Pontszám: ${score}</span></div>
    <div class="bar"><i style="width:${idx / N * 100}%"></i></div>
    <div class="card">
      <p class="q">${esc(o.q)}</p>
      <div class="choices">
        <button data-v="true" id="bt">Igaz</button>
        <button data-v="false" id="bf">Hamis</button>
      </div>
      <div id="fb"></div>
    </div>`;
  document.getElementById('bt').onclick = () => answer(true);
  document.getElementById('bf').onclick = () => answer(false);
}

function answer(v) {
  if (answered) return; answered = true;
  const o = qs[idx], good = v === o.a;
  if (good) score++;
  answers.push({o, v, good});
  const bt = document.getElementById('bt'), bf = document.getElementById('bf');
  [bt, bf].forEach(b => b.disabled = true);
  (v ? bt : bf).classList.add('picked', good ? 'right' : 'wrong');
  if (!good) (o.a ? bt : bf).classList.add('right');
  const last = idx === N - 1;
  document.getElementById('fb').innerHTML = `
    <div class="fb ${good ? 'ok' : 'bad'}" aria-live="polite">
      <b>${good ? 'Helyes' : 'Hibás'} – a válasz: ${o.a ? 'IGAZ' : 'HAMIS'}</b>
      ${esc(o.e)}
      <div class="ref">Hivatkozás: ${esc(o.r)}</div>${inf(o)}
    </div>
    <div class="actions"><button class="primary" id="next">${last ? 'Eredmény' : 'Következő kérdés'}</button></div>`;
  const nx = document.getElementById('next'); nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next() { if (idx === N - 1) return finish(); idx++; show(); window.scrollTo(0, 0); }

function finish() {
  const g = grade(score), pass = g > 1;
  const wrong = answers.filter(x => !x.good);
  app.innerHTML = `
    <h1>Eredmény</h1>
    <div class="card">
      <div class="meta"><span>Pontszám</span></div>
      <div style="font:700 2rem Georgia,serif">${score} / ${N}</div>
      <div class="grade ${pass ? 'pass' : 'fail'}">${pass ? g : 'Bukás'}</div>
      <p>${pass ? 'Jegy: ' + g + ' (' + gradeName(g) + ')' : 'Elégtelen: legalább 17 pont kell az elégségeshez.'}</p>
      <div class="actions" style="justify-content:flex-start"><button class="primary" id="again">Új teszt (új kérdések)</button></div>
    </div>
    <h2 style="font:700 1.2rem Georgia,serif;margin:24px 0 4px">${wrong.length ? 'Hibás válaszaid (' + wrong.length + ')' : 'Hibátlan teszt!'}</h2>
    ${wrong.map(x => `<details><summary>${esc(x.o.q)}</summary>
      <p>Te ezt választottad: <b>${x.v ? 'IGAZ' : 'HAMIS'}</b>, a helyes válasz: <b>${x.o.a ? 'IGAZ' : 'HAMIS'}</b>.</p>
      <p>${esc(x.o.e)}</p><div class="ref">Hivatkozás: ${esc(x.o.r)}</div>${inf(x.o)}</details>`).join('')}`;
  document.getElementById('again').onclick = start;
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!qs.length || !document.getElementById('bt')) return;
  const k = e.key.toLowerCase();
  if (!answered && (k === 'i' || k === 'h')) answer(k === 'i');
});
home();
</script>
</body>
</html>
